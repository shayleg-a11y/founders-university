<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Founder's University — From Idea to Exit</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23C9A227'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='19' font-weight='bold' text-anchor='middle' fill='%230B0B0B'%3EF%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#07090F">
<meta property="og:title" content="Founder's University — From Idea to Exit">
<meta property="og:description" content="Eight modules, 120 lessons, 144 graded questions, and a capstone that ends in an exit-ready business plan.">
<meta name="description" content="A premium business university. Eight modules from idea to exit, 120 lessons, auto-graded judgment quizzes, and a capstone that produces an exit-ready business plan.">
<style>
/* ============================= design tokens ============================= */
:root{
  --ink:#07090F; --ink-2:#0C1018; --panel:#111725; --panel-2:#161E2F; --line:#212B40;
  --line-2:#2C3A55; --fg:#EEF0F4; --fg-2:#A7B0C2; --fg-3:#6F7A90;
  --gold:#C9A227; --gold-2:#E7C86A; --gold-soft:rgba(201,162,39,.13);
  --ok:#37C08A; --bad:#F0616B; --warn:#E8A33D;
  --r:14px; --r-lg:22px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,ui-serif,serif;
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --maxw:1180px;
  --shadow:0 24px 60px -22px rgba(0,0,0,.75);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ink);color:var(--fg);font-family:var(--sans);
  font-size:16px;line-height:1.65;letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
img{max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3,h4{margin:0;font-family:var(--serif);font-weight:600;letter-spacing:-.02em;line-height:1.12}
p{margin:0 0 1em}
::selection{background:var(--gold);color:#0B0B0B}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}
.narrow{max-width:820px;margin:0 auto;padding:0 24px}

/* scrollbar */
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--ink)}
::-webkit-scrollbar-thumb{background:#243049;border-radius:9px;border:3px solid var(--ink)}
::-webkit-scrollbar-thumb:hover{background:#31415f}

/* ============================= atoms ============================= */
.eyebrow{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.19em;
  text-transform:uppercase;color:var(--gold);margin:0 0 14px
}
.eyebrow.mute{color:var(--fg-3)}
.lede{font-size:19px;line-height:1.62;color:var(--fg-2)}
.small{font-size:13.5px;color:var(--fg-3)}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);border:0;margin:0}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:13px 26px;border-radius:999px;font-size:14.5px;font-weight:600;
  letter-spacing:.01em;transition:.18s ease;white-space:nowrap;border:1px solid transparent;
}
.btn-gold{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:#100D02;
  box-shadow:0 10px 30px -12px rgba(201,162,39,.6)}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 16px 38px -12px rgba(201,162,39,.75)}
.btn-ghost{border-color:var(--line-2);color:var(--fg)}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold-2);background:var(--gold-soft)}
.btn-sm{padding:9px 18px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}

.chip{
  display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);font-size:11.5px;font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2)
}
.chip.gold{border-color:rgba(201,162,39,.42);color:var(--gold-2);background:var(--gold-soft)}
.chip.ok{border-color:rgba(55,192,138,.4);color:var(--ok);background:rgba(55,192,138,.09)}

.card{
  background:linear-gradient(170deg,var(--panel),var(--ink-2));
  border:1px solid var(--line);border-radius:var(--r-lg);padding:26px;position:relative;
  transition:.22s ease;
}
.card:hover{border-color:var(--line-2)}
.card.link:hover{transform:translateY(-3px);box-shadow:var(--shadow)}

.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}

.bar{height:5px;border-radius:99px;background:#1B2334;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold-2));transition:width .5s ease}

/* ============================= nav ============================= */
header.nav{
  position:sticky;top:0;z-index:60;backdrop-filter:blur(16px);
  background:rgba(7,9,15,.82);border-bottom:1px solid var(--line);
}
.nav-in{display:flex;align-items:center;gap:26px;height:66px}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
.crest{
  width:32px;height:32px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(150deg,var(--gold-2),var(--gold) 55%,#8A6E14);
  display:grid;place-items:center;color:#0B0B0B;font-family:var(--serif);
  font-weight:700;font-size:16px;letter-spacing:-.04em;
  box-shadow:0 6px 18px -6px rgba(201,162,39,.6)
}
.brand b{font-family:var(--serif);font-size:17.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand b i{font-style:italic;color:var(--gold-2);font-weight:500}
nav.links{display:flex;gap:4px;margin-left:8px;flex:1}
nav.links a{
  padding:8px 13px;border-radius:9px;font-size:14px;color:var(--fg-2);font-weight:500;transition:.15s
}
nav.links a:hover{color:var(--fg);background:var(--panel)}
nav.links a.on{color:var(--gold-2);background:var(--gold-soft)}
.nav-right{display:flex;align-items:center;gap:10px;flex-shrink:0;margin-left:auto}
.navburger{display:none;padding:8px;border-radius:9px;border:1px solid var(--line)}
@media(max-width:980px){
  nav.links{display:none}
  .navburger{display:block}
  nav.links.open{
    display:flex;position:absolute;top:66px;left:0;right:0;flex-direction:column;gap:2px;
    background:var(--ink-2);border-bottom:1px solid var(--line);padding:12px 16px 18px
  }
  .nav-in{gap:12px}
}
@media(max-width:560px){.nav-right .btn{display:none}.nav-right .btn.always{display:inline-flex}}

/* ============================= hero ============================= */
.hero{position:relative;padding:104px 0 88px;overflow:hidden}
.hero:before{
  content:"";position:absolute;inset:-40% -20% auto -20%;height:760px;pointer-events:none;
  background:radial-gradient(58% 50% at 50% 42%,rgba(201,162,39,.15),transparent 68%);
}
.hero:after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(60% 46% at 50% 34%,#000,transparent 72%);
  mask-image:radial-gradient(60% 46% at 50% 34%,#000,transparent 72%);
}
.hero .wrap{position:relative;z-index:1;text-align:center}
.hero h1{font-size:clamp(40px,6.6vw,78px);margin:0 0 22px}
.hero h1 i{font-style:italic;color:var(--gold-2);display:block}
.hero .lede{max-width:640px;margin:0 auto 32px}
.cta-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.ticker{
  margin-top:34px;font-size:11px;letter-spacing:.17em;text-transform:uppercase;
  color:var(--fg-3);display:flex;gap:14px;justify-content:center;flex-wrap:wrap;align-items:center
}
.ticker .dot{color:var(--gold);opacity:.6}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-top:58px}
.stats div{background:var(--ink-2);padding:26px 18px;text-align:center}
.stats b{display:block;font-family:var(--serif);font-size:34px;color:var(--gold-2);line-height:1}
.stats span{display:block;margin-top:7px;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--fg-3)}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}

section{padding:86px 0}
.sec-head{max-width:720px;margin:0 0 44px}
.sec-head.center{margin:0 auto 44px;text-align:center}
.sec-head h2{font-size:clamp(29px,4.2vw,44px);margin:0 0 16px}
.sec-head h2 i{font-style:italic;color:var(--gold-2)}

/* ============================= path / modules ============================= */
.phase-band{display:flex;align-items:center;gap:16px;margin:52px 0 22px}
.phase-band:first-child{margin-top:0}
.phase-num{
  font-family:var(--serif);font-size:13px;letter-spacing:.22em;color:var(--gold);
  text-transform:uppercase;white-space:nowrap
}
.phase-band h3{font-size:26px;white-space:nowrap}
.phase-band .rule{flex:1}

.mod{display:flex;gap:22px;align-items:flex-start;text-align:left;width:100%}
.mod-n{
  font-family:var(--serif);font-size:40px;line-height:1;color:var(--line-2);
  flex-shrink:0;width:58px;transition:.2s
}
.card.link:hover .mod-n{color:var(--gold)}
.mod-b{flex:1;min-width:0}
.mod-b h4{font-size:20px;margin:0 0 8px}
.mod-b p{font-size:14.5px;color:var(--fg-2);margin:0 0 14px}
.mod-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ring{--p:0;width:46px;height:46px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--gold) calc(var(--p)*1%),#1B2334 0);position:relative}
.ring:before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--ink-2)}
.ring span{position:relative;font-size:11px;font-weight:700;color:var(--fg-2)}
@media(max-width:560px){.mod{gap:14px}.mod-n{width:40px;font-size:30px}}

/* ============================= lists ============================= */
.lrow{
  display:flex;align-items:center;gap:15px;padding:15px 18px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--ink-2);transition:.16s;width:100%;text-align:left;margin-bottom:9px
}
.lrow:hover{border-color:var(--line-2);background:var(--panel);transform:translateX(3px)}
.lrow .tick{
  width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-2);flex-shrink:0;
  display:grid;place-items:center;font-size:12px;color:var(--fg-3);font-weight:700
}
.lrow.done .tick{background:var(--ok);border-color:var(--ok);color:#062;}
.lrow.done .lt{color:var(--fg-3)}
.lt{flex:1;font-size:15px;font-weight:500;min-width:0}
.lt small{display:block;font-size:12.5px;color:var(--fg-3);font-weight:400;margin-top:2px}
.lrow .mins{font-size:12px;color:var(--fg-3);flex-shrink:0;font-variant-numeric:tabular-nums}

/* ============================= school cards ============================= */
.school{border-radius:var(--r-lg);padding:26px;border:1px solid var(--line);position:relative;
  background:linear-gradient(170deg,var(--panel),var(--ink-2));overflow:hidden;transition:.22s;text-align:left;width:100%}
.school:before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--ac)}
.school:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:var(--shadow)}
.school .ico{font-size:26px;margin-bottom:14px;display:block}
.school h4{font-size:19px;margin:0 0 8px}
.school p{font-size:14px;color:var(--fg-2);margin:0 0 16px}

/* ============================= lesson reader ============================= */
.reader{max-width:760px;margin:0 auto;padding:0 24px 90px}
.reader h1{font-size:clamp(28px,4.4vw,42px);margin:0 0 18px}
.reader h3{font-family:var(--serif);font-size:24px;margin:44px 0 14px;color:var(--fg)}
.reader p{font-size:17px;line-height:1.78;color:#D8DCE4}
.hook{
  border-left:3px solid var(--gold);padding:4px 0 4px 20px;margin:26px 0 34px;
  font-family:var(--serif);font-size:20px;line-height:1.55;color:var(--gold-2);font-style:italic
}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;margin:30px 0}
.box h5{margin:0 0 12px;font-family:var(--sans);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--gold);font-weight:700}
.box p:last-child,.box ul:last-child{margin-bottom:0}
.box.example{border-color:rgba(201,162,39,.3);background:linear-gradient(170deg,rgba(201,162,39,.07),var(--panel))}
.box.drill{border-color:rgba(55,192,138,.32);background:rgba(55,192,138,.05)}
.box.drill h5{color:var(--ok)}
.formula{
  text-align:center;font-family:var(--mono);font-size:17px;color:var(--gold-2);
  background:var(--ink);border:1px dashed var(--line-2);border-radius:10px;padding:18px;margin:14px 0
}
.reader ul{padding-left:22px;margin:0 0 1em}
.reader li{font-size:16px;line-height:1.7;margin-bottom:9px;color:#D8DCE4}
.reader li::marker{color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:14.5px;margin:8px 0}
th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--fg-3);font-weight:700}
td{color:#D8DCE4}
tbody tr:last-child td{border-bottom:0}
caption{caption-side:bottom;font-size:12.5px;color:var(--fg-3);padding-top:10px;text-align:left}

.readbar{position:fixed;top:0;left:0;height:2px;background:var(--gold);z-index:100;transition:width .1s}
.lesson-nav{display:flex;gap:12px;justify-content:space-between;margin-top:50px;flex-wrap:wrap}

/* ============================= quiz ============================= */
.q{border:1px solid var(--line);border-radius:var(--r);padding:24px;margin-bottom:16px;background:var(--ink-2)}
.q>b{display:block;font-size:17px;margin-bottom:16px;font-weight:600;line-height:1.5}
.opt{
  display:flex;gap:13px;align-items:flex-start;padding:13px 16px;border:1px solid var(--line);
  border-radius:11px;margin-bottom:9px;cursor:pointer;transition:.14s;font-size:15px;width:100%;text-align:left
}
.opt:hover{border-color:var(--line-2);background:var(--panel)}
.opt .k{width:22px;height:22px;border-radius:6px;border:1px solid var(--line-2);flex-shrink:0;
  display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--fg-3)}
.opt.sel{border-color:var(--gold);background:var(--gold-soft)}
.opt.sel .k{background:var(--gold);border-color:var(--gold);color:#100D02}
.opt.right{border-color:var(--ok);background:rgba(55,192,138,.1)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#052}
.opt.wrong{border-color:var(--bad);background:rgba(240,97,107,.09)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#3b0}
.expl{margin-top:12px;padding:13px 16px;border-radius:10px;background:var(--panel);
  font-size:14.5px;color:var(--fg-2);border-left:2px solid var(--gold)}
.score-ring{--p:0;width:132px;height:132px;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--sc) calc(var(--p)*1%),#1B2334 0);position:relative}
.score-ring:before{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--ink-2)}
.score-ring b{position:relative;font-family:var(--serif);font-size:36px}

/* ============================= assessment ============================= */
.scale{display:flex;gap:7px;flex-wrap:wrap}
.scale button{flex:1;min-width:44px;padding:12px 4px;border:1px solid var(--line);border-radius:10px;
  font-size:14px;font-weight:600;color:var(--fg-3);transition:.14s}
.scale button:hover{border-color:var(--line-2);color:var(--fg)}
.scale button.on{background:var(--gold);border-color:var(--gold);color:#100D02}
.dim{margin-bottom:18px}
.dim-h{display:flex;justify-content:space-between;font-size:14px;margin-bottom:7px}
.dim-h b{font-weight:600}
.dim-h span{color:var(--fg-3);font-variant-numeric:tabular-nums}

/* ============================= certificate ============================= */
.cert{
  background:linear-gradient(160deg,#12172400,#0d1220);border:2px solid var(--gold);
  border-radius:8px;padding:56px 46px;text-align:center;position:relative;
  box-shadow:0 30px 80px -30px rgba(201,162,39,.35)
}
.cert:before{content:"";position:absolute;inset:9px;border:1px solid rgba(201,162,39,.35);border-radius:4px;pointer-events:none}
.cert .nm{font-family:var(--serif);font-size:clamp(30px,5vw,48px);color:var(--gold-2);margin:22px 0 14px;font-style:italic}
.cert .seal{width:74px;height:74px;margin:0 auto 8px;border-radius:50%;
  background:linear-gradient(150deg,var(--gold-2),var(--gold) 60%,#8A6E14);display:grid;place-items:center;
  font-family:var(--serif);font-size:26px;color:#0B0B0B;font-weight:700}

/* ============================= misc ============================= */
.faq{border-bottom:1px solid var(--line)}
.faq summary{padding:20px 0;font-size:17px;font-weight:600;cursor:pointer;list-style:none;
  display:flex;justify-content:space-between;gap:20px;align-items:flex-start;font-family:var(--serif)}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"+";color:var(--gold);font-size:22px;line-height:1;flex-shrink:0;transition:.2s}
.faq[open] summary:after{transform:rotate(45deg)}
.faq p{font-size:15.5px;color:var(--fg-2);padding-bottom:20px;margin:0;max-width:70ch}

.tier{display:flex;flex-direction:column;height:100%}
.tier .price{font-family:var(--serif);font-size:36px;color:var(--fg);margin:6px 0 4px}
.tier ul{list-style:none;padding:0;margin:18px 0;flex:1}
.tier li{font-size:14.5px;color:var(--fg-2);padding:7px 0 7px 25px;position:relative}
.tier li:before{content:"";position:absolute;left:0;top:15px;width:11px;height:2px;background:var(--gold)}
.tier.feature{border-color:rgba(201,162,39,.45);background:linear-gradient(170deg,rgba(201,162,39,.09),var(--ink-2))}

footer{border-top:1px solid var(--line);padding:52px 0 40px;color:var(--fg-3);font-size:13.5px}
.foot{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap}
.foot a{color:var(--fg-2)}.foot a:hover{color:var(--gold-2)}

.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,140%);z-index:200;
  background:var(--panel-2);border:1px solid var(--line-2);border-radius:999px;padding:12px 24px;
  font-size:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .2s ease
}
.toast.show{transform:translate(-50%,0);opacity:1}

.srch{width:100%;padding:14px 18px;border-radius:12px;background:var(--ink-2);
  border:1px solid var(--line);color:var(--fg);font-size:15px;outline:none}
.srch:focus{border-color:var(--gold)}
textarea.fld{display:block;margin-top:8px;resize:vertical;line-height:1.5;min-height:104px}
input.fld,textarea.fld{width:100%;padding:13px 16px;border-radius:11px;background:var(--ink);border:1px solid var(--line);
  color:var(--fg);font-size:15px;outline:none;font-family:inherit}
input.fld:focus,textarea.fld:focus{border-color:var(--gold)}

/* ============================= simulations ============================= */
.simpanel{background:linear-gradient(170deg,var(--panel),var(--ink-2));border:1px solid var(--line);
  border-radius:var(--r-lg);padding:26px;margin-bottom:18px}
.simp{font-size:15.5px;color:var(--fg-2);max-width:72ch}
.simh5{font-family:var(--serif);font-size:19px;margin:24px 0 10px}
.simhint{font-size:13px;color:var(--fg-3);margin:-4px 0 16px;line-height:1.5}
.lever{margin-bottom:16px}
.lever-h{display:flex;justify-content:space-between;align-items:baseline;gap:14px;font-size:14.5px;margin-bottom:7px}
.lever-h b{font-variant-numeric:tabular-nums;color:var(--gold-2);font-size:15px}
.lever input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:5px;border-radius:99px;
  background:#1B2334;outline:none}
.lever input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;

<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
/* =========================================================================
   Founder's University — backend client
   A deliberately small Supabase client written by hand rather than pulled from
   a CDN: the app ships as one file with no dependencies, and the surface we
   need (password auth + PostgREST reads/writes) is a few hundred lines.
   ========================================================================= */
window.SU_DB = (function () {
"use strict";

var URL_BASE = "https://hyugijoirmxhdnowpcth.supabase.co";
var ANON = "sb_publishable_vyHomd6XAxNZ33wxOnI_jA_3JWL0cUb";
var TOKEN_KEY = "fu-session-v1";

/* ------------------------------------------------------------- session -- */
var mem = null;
function readSession() {
  try {
    var raw = window.localStorage.getItem(TOKEN_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return mem; }
}
function writeSession(s) {
  mem = s;
  try {
    if (s) window.localStorage.setItem(TOKEN_KEY, JSON.stringify(s));
    else window.localStorage.removeItem(TOKEN_KEY);
  } catch (e) { /* storage blocked: session lives for this tab only */ }
}
var session = readSession();

function expired(s) {
  return !s || !s.expires_at || (s.expires_at * 1000 - 60000) < Date.now();
}

/* ------------------------------------------------------------ transport -- */
function req(path, opts) {
  opts = opts || {};
  var headers = {
    "apikey": ANON,
    "Content-Type": "application/json"
  };
  if (opts.headers) for (var k in opts.headers) headers[k] = opts.headers[k];
  if (!headers.Authorization) {
    headers.Authorization = "Bearer " + (session && session.access_token ? session.access_token : ANON);
  }
  return fetch(URL_BASE + path, {
    method: opts.method || "GET",
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function (r) {
    if (r.status === 204) return null;
    return r.text().then(function (t) {
      var data = null;
      try { data = t ? JSON.parse(t) : null; } catch (e) { data = t; }
      if (!r.ok) {
        var msg = (data && (data.msg || data.message || data.error_description || data.error)) || ("HTTP " + r.status);
        var err = new Error(msg); err.status = r.status; err.data = data;
        throw err;
      }
      return data;
    });
  });
}

// Refresh an expired token once, then retry.
function authed(path, opts) {
  if (session && expired(session) && session.refresh_token) {
    return refresh().then(function () { return req(path, opts); });
  }
  return req(path, opts);
}

function refresh() {
  if (!session || !session.refresh_token) return Promise.resolve(null);
  return req("/auth/v1/token?grant_type=refresh_token", {
    method: "POST",
    headers: { Authorization: "Bearer " + ANON },
    body: { refresh_token: session.refresh_token }
  }).then(function (s) {
    session = normalise(s); writeSession(session); return session;
  }).catch(function () {
    session = null; writeSession(null); return null;
  });
}

function normalise(s) {
  if (!s || !s.access_token) return null;
  return {
    access_token: s.access_token,
    refresh_token: s.refresh_token,
    expires_at: s.expires_at || Math.floor(Date.now() / 1000) + (s.expires_in || 3600),
    user: s.user || null
  };
}

/* ----------------------------------------------------------------- auth -- */
function signUp(email, password, displayName) {
  return req("/auth/v1/signup?redirect_to=" + encodeURIComponent(location.origin + location.pathname), {
    method: "POST",
    headers: { Authorization: "Bearer " + ANON },
    body: { email: email, password: password, data: { display_name: displayName || "" } }
  }).then(function (r) {
    // With email confirmation on, no session comes back until they confirm.
    var s = normalise(r);
    if (s) { session = s; writeSession(s); }
    return { session: s, needsConfirmation: !s, user: r && r.user };
  });
}

// Email links (confirm, reset) come back as "#access_token=..." or "#error=...", which is
// not a route. Take the session or the error out of the address bar before the router runs.
function adoptUrlSession() {
  var h = (window.location.hash || "").replace(/^#\/?/, "");
  if (!/(^|&)(access_token|error_description|error_code)=/.test(h)) return Promise.resolve(null);
  var q = {};
  h.split("&").forEach(function (kv) {
    var i = kv.indexOf("=");
    if (i > 0) { try { q[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, " ")); } catch (e) {} }
  });
  function to(route) {
    try { history.replaceState(null, "", location.pathname + location.search + route); }
    catch (e) { location.hash = route; }
  }
  to("#/signin");
  if (!q.access_token) {
    return Promise.resolve({ error: "That link has expired or was already used. If you confirmed your email, sign in with your password." });
  }
  return req("/auth/v1/user", { headers: { Authorization: "Bearer " + q.access_token } }).then(function (u) {
    // A link must never swap a signed-in visitor into a different account.
    if (session && session.user && u && session.user.id !== u.id && !expired(session)) {
      to("#/path");
      return { error: "You are already signed in as " + (session.user.email || "another account") + ". Sign out first to use this link." };
    }
    session = normalise({ access_token: q.access_token, refresh_token: q.refresh_token,
      expires_in: +q.expires_in || 3600, user: u });
    writeSession(session);
    to("#/path");
    return { session: session };
  }).catch(function () {
    return { error: "Your email is confirmed. Sign in with your password." };
  });
}

function signIn(email, password) {
  return req("/auth/v1/token?grant_type=password", {
    method: "POST",
    headers: { Authorization: "Bearer " + ANON },
    body: { email: email, password: password }
  }).then(function (r) {
    session = normalise(r); writeSession(session); return session;
  });
}

function signOut() {
  var done = session
    ? req("/auth/v1/logout", { method: "POST" }).catch(function () { return null; })
    : Promise.resolve(null);
  return done.then(function () {
    session = null; writeSession(null);
    // Any caller of signOut must drop cached paid content, not just the button
    // in the account view.
    try { window.dispatchEvent(new CustomEvent("fu:signout")); } catch (e) {}
  });
}

function resetPassword(email, redirectTo) {
  return req("/auth/v1/recover", {
    method: "POST",
    headers: { Authorization: "Bearer " + ANON },
    body: { email: email, gotrue_meta_security: {}, redirect_to: redirectTo }
  });
}

function currentUser() { return session && session.user ? session.user : null; }
function signedIn() { return !!session; }
function userId() {
  var u = currentUser();
  return u ? u.id : null;
}

/* ------------------------------------------------------------- REST ops -- */
function sel(table, query) {
  return authed("/rest/v1/" + table + (query ? "?" + query : ""));
}
function ins(table, rows, prefer) {
  return authed("/rest/v1/" + table, {
    method: "POST",
    headers: { Prefer: prefer || "return=representation" },
    body: rows
  });
}
function upsert(table, rows, onConflict) {
  return authed("/rest/v1/" + table + (onConflict ? "?on_conflict=" + onConflict : ""), {
    method: "POST",
    headers: { Prefer: "resolution=merge-duplicates,return=representation" },
    body: rows
  });
}
function del(table, query) {
  return authed("/rest/v1/" + table + "?" + query, { method: "DELETE" });
}

/* ------------------------------------------------------------- domain --- */

// The public catalogue: everything needed to render the site for a visitor who
// has not paid. Deliberately excludes lesson bodies and answer keys.
function catalogue() {
  return Promise.all([
    sel("schools", "select=*&order=position"),
    sel("courses", "select=*&order=position"),
    sel("lessons", "select=*&order=position")
  ]).then(function (r) {
    var schools = r[0], courses = r[1], lessons = r[2];
    var byCourse = {};
    lessons.forEach(function (l) { (byCourse[l.course_id] = byCourse[l.course_id] || []).push(l); });
    var bySchool = {};
    courses.forEach(function (c) {
      c.lessons = byCourse[c.id] || [];
      (bySchool[c.school_id] = bySchool[c.school_id] || []).push(c);
    });
    var out = {};
    schools.forEach(function (s) { s.courses = bySchool[s.id] || []; out[s.id] = s; });
    return out;
  });
}

// Paid. Returns null when RLS withholds it — that is the locked state.
function lessonBody(lessonId) {
  return sel("lesson_bodies", "lesson_id=eq." + encodeURIComponent(lessonId) + "&select=*")
    .then(function (rows) { return (rows && rows[0]) || null; });
}

function quizQuestions(courseId) {
  return sel("quiz_questions", "course_id=eq." + encodeURIComponent(courseId) + "&select=*&order=position");
}
// Paid. Empty array means not entitled.
function quizAnswers(courseId) {
  return sel("quiz_answers",
    "select=question_id,answer,explain,quiz_questions!inner(course_id)" +
    "&quiz_questions.course_id=eq." + encodeURIComponent(courseId))
    .catch(function () { return []; });
}

function entitlements() {
  if (!signedIn()) return Promise.resolve([]);
  return sel("entitlements", "select=tier,status,granted_at&status=eq.active")
    .catch(function () { return []; });
}

/* ----------------------------------------------------------- progress --- */
function loadProgress() {
  if (!signedIn()) return Promise.resolve(null);
  return Promise.all([
    sel("lesson_progress", "select=lesson_id"),
    sel("quiz_attempts", "select=course_id,score,passed,created_at&order=created_at"),
    sel("sim_results", "select=sim_id,score,passed,summary,created_at&order=created_at"),
    sel("milestones", "select=module_id"),
    sel("fit_reports", "select=answers,score,track,created_at&order=created_at.desc&limit=1"),
    sel("profiles", "select=display_name,track")
  ]).then(function (r) {
    var done = {}; (r[0] || []).forEach(function (x) { done[x.lesson_id] = 1; });
    var quiz = {};
    (r[1] || []).forEach(function (a) {
      var rec = quiz[a.course_id] || { best: 0, attempts: 0, passed: false };
      rec.attempts++; rec.best = Math.max(rec.best, a.score); rec.passed = rec.passed || a.passed;
      quiz[a.course_id] = rec;
    });
    var sims = {};
    (r[2] || []).forEach(function (s) {
      var rec = sims[s.sim_id] || { best: 0, attempts: 0, passed: false, last: "" };
      rec.attempts++; rec.best = Math.max(rec.best, s.score);
      rec.passed = rec.passed || s.passed; rec.last = s.summary || rec.last;
      sims[s.sim_id] = rec;
    });
    var ms = {}; (r[3] || []).forEach(function (m) { ms[m.module_id] = true; });
    var fit = (r[4] && r[4][0]) ? r[4][0] : null;
    var prof = (r[5] && r[5][0]) ? r[5][0] : {};
    return {
      done: done, quiz: quiz, sims: sims, milestones: ms,
      fit: fit ? { answers: fit.answers, score: fit.score, track: fit.track } : null,
      name: prof.display_name || "", track: prof.track || ""
    };
  });
}

function markLesson(lessonId, complete) {
  if (!signedIn()) return Promise.resolve();
  var uid = userId();
  return complete
    ? upsert("lesson_progress", [{ user_id: uid, lesson_id: lessonId }], "user_id,lesson_id")
    : del("lesson_progress", "lesson_id=eq." + encodeURIComponent(lessonId));
}
function recordQuiz(courseId, score, passed, answers) {
  if (!signedIn()) return Promise.resolve();
  return ins("quiz_attempts",
    [{ user_id: userId(), course_id: courseId, score: score, passed: passed, answers: answers || null }],
    "return=minimal");
}
function recordSim(simId, score, passed, summary) {
  if (!signedIn()) return Promise.resolve();
  return ins("sim_results",
    [{ user_id: userId(), sim_id: simId, score: score, passed: passed, summary: summary || null }],
    "return=minimal");
}
function setMilestone(moduleId, on) {
  if (!signedIn()) return Promise.resolve();
  return on
    ? upsert("milestones", [{ user_id: userId(), module_id: moduleId }], "user_id,module_id")
    : del("milestones", "module_id=eq." + encodeURIComponent(moduleId));
}
function saveFit(answers, score, track) {
  if (!signedIn()) return Promise.resolve();
  return ins("fit_reports",
    [{ user_id: userId(), answers: answers, score: score, track: track }], "return=minimal");
}
function saveProfile(fields) {
  if (!signedIn()) return Promise.resolve();
  return authed("/rest/v1/profiles?id=eq." + userId(), {
    method: "PATCH", headers: { Prefer: "return=minimal" }, body: fields
  });
}
function submitApplication(row) {
  return ins("applications", [row], "return=minimal");
}

/* -------------------------------------------------- admissions / admin --- */
function rpc(name, args) {
  return authed("/rest/v1/rpc/" + name, { method: "POST", body: args || {} });
}
// Asks the server; the allow-list itself is never readable from the client.
function amAdmin() {
  if (!signedIn()) return Promise.resolve(false);
  return rpc("am_admin").then(function (r) { return r === true; }).catch(function () { return false; });
}
// Newest application belonging to the signed-in user (by account or by email).
// Filtered explicitly because an admin's read policy returns everyone's rows.
function myApplication() {
  var u = currentUser();
  if (!signedIn() || !u) return Promise.resolve(null);
  var own = "user_id.eq." + u.id;
  if (u.email) own += ',email.eq."' + String(u.email).toLowerCase().replace(/["\\]/g, "") + '"';
  return sel("applications", "select=id,status,created_at,decided_at,track&or=" +
      encodeURIComponent("(" + own + ")") + "&order=created_at.desc&limit=20")
    .then(function (r) {
      r = r || [];
      return r.filter(function (a) { return a.status === "accepted"; })[0] || r[0] || null;
    })
    .catch(function () { return null; });
}
function adminApplications() {
  return Promise.all([
    sel("applications", "select=*&order=created_at.desc&limit=500"),
    sel("application_schedule", "select=application_id,accept_at&limit=1000").catch(function () { return []; })
  ]).then(function (r) {
    var at = {};
    (r[1] || []).forEach(function (x) { at[x.application_id] = x.accept_at; });
    return (r[0] || []).map(function (a) { a.accept_at = at[a.id] || null; return a; });
  });
}
function adminDecide(id, status) {
  var decided = status === "accepted" || status === "declined";
  return authed("/rest/v1/applications?id=eq." + encodeURIComponent(id) +
      (status === "reviewing" ? "&status=in.(accepted,declined)" : "&status=in.(submitted,reviewing)"), {
    method: "PATCH",
    headers: { Prefer: "return=representation" },
    body: { status: status, decided_at: decided ? new Date().toISOString() : null }
  }).then(function (r) {
    if (!r || !r[0]) throw new Error("Not permitted");
    return r[0];
  });
}
function adminStudents() {
  return Promise.all([
    sel("profiles", "select=id,email,display_name,track,created_at&order=created_at.desc&limit=1000"),
    sel("entitlements", "select=user_id,tier,status,source,granted_at&order=granted_at"),
    rpc("admin_lesson_counts")
  ]).then(function (r) {
    var ents = {}, done = {};
    (r[1] || []).forEach(function (e) { (ents[e.user_id] = ents[e.user_id] || []).push(e); });
    (r[2] || []).forEach(function (x) { done[x.user_id] = +x.n || 0; });
    return (r[0] || []).map(function (p) {
      p.entitlements = ents[p.id] || []; p.lessons_done = done[p.id] || 0; return p;
    });
  });
}

return {
  url: URL_BASE,
  signUp: signUp, signIn: signIn, signOut: signOut, resetPassword: resetPassword,
  signedIn: signedIn, currentUser: currentUser, userId: userId, refresh: refresh,
  catalogue: catalogue, lessonBody: lessonBody,
  quizQuestions: quizQuestions, quizAnswers: quizAnswers,
  entitlements: entitlements, loadProgress: loadProgress,
  markLesson: markLesson, recordQuiz: recordQuiz, recordSim: recordSim,
  setMilestone: setMilestone, saveFit: saveFit, saveProfile: saveProfile,
  submitApplication: submitApplication,
  adoptUrlSession: adoptUrlSession,
  amAdmin: amAdmin, myApplication: myApplication,
  adminApplications: adminApplications, adminDecide: adminDecide, adminStudents: adminStudents
};
})();

    { id:"scale", num:"Phase II", title:"Scale", blurb:"Turn one-off wins into a machine: repeatable acquisition, a team, and financial control." },
    { id:"sell",  num:"Phase III", title:"Sell", blurb:"Understand what a buyer pays for, and build the business so it is worth buying." }
  ],
  modules: [
    { n:"01", id:"m01", phase:"build", title:"Find Your Business",
      desc:"Identify one viable direction at the intersection of what you can do, what people will pay for, and what the economics allow.",
      milestone:"The Direction", deliverable:"A one-page niche thesis with three scored alternatives",
      sim:"Niche Sniper",
      lessons:["entrepreneurship-c1-l1","entrepreneurship-c1-l2","foundations-c2-l1","foundations-c2-l5","analytics-c2-l1"] },

    { n:"02", id:"m02", phase:"build", title:"Validate Before You Build",
      desc:"Test the idea with evidence before committing real capital. Learn what proof actually looks like and set kill criteria in advance.",

function niche(el, finish) {
  var w = { demand: 17, comp: 17, skill: 17, margin: 17, reach: 16, capital: 16 };
  var picked = null, stage = 1;

  function score(n, ws) {
    var t = 0, tot = 0;

    return tot ? t / tot : 0;
  }

        if (sum() !== 100) return;

      }

          h("div", { class: "simhint", text: c.why })

      })).concat([h("div", { style: "margin-top:16px" }, [next])])));
      refresh();

    var ranked = NICHES.map(function (n) { return { n: n, s: score(n, w) }; })

          return h("button", { class: "nichecard" + (picked === r.n ? " sel" : ""), onclick: function () { picked = r.n; draw(); } }, [
            h("div", { class: "nrank", text: "#" + (i + 1) }),
            h("b", { text: r.n.n }),
            h("div", { class: "nscore", text: "Your score " + r.s.toFixed(1) + " / 10" }),
            h("div", { class: "nattrs" }, CRITS.map(function (c) {

    // results
    var trueRank = NICHES.map(function (n) { return { n: n, s: score(n, TRUE_W) }; })
      .sort(function (a, b) { return b.s - a.s; });
    var truePos = trueRank.findIndex(function (r) { return r.n === picked; });
    var passed = truePos <= 1;
    var drift = CRITS.reduce(function (a, c) { return a + Math.abs(w[c.k] - TRUE_W[c.k]); }, 0);
    var modelScore = Math.max(0, 100 - drift * 1.4);
    var final = Math.round(modelScore * 0.4 + (passed ? 60 : truePos === 2 ? 30 : 10));

    var biggest = CRITS.map(function (c) { return { c: c, d: w[c.k] - TRUE_W[c.k] }; })
      .sort(function (a, b) { return Math.abs(b.d) - Math.abs(a.d); })[0];

    el.appendChild(panel("Verdict", [
      verdict(passed, picked.n,
        "<b>" + picked.truth + "</b><br><br>Against an outcome-weighted model this direction ranks <b>#" +
        (truePos + 1) + " of 6</b>. " +

        btn("Record result", "btn-gold", function () {

        })
      ])
    ]));
  }
  draw();
}

function margin(el, finish) {
  var s = { price: 49, del: 1, onb: 1, pos: 1 };
  var T = { cmPct: 65, ratio: 3, payback: 12, profit: 6000 };

  function model(st) {
    var d = DELIVERY[st.del], o = ONBOARD[st.onb], p = POSTURE[st.pos];
    var lift = Math.max(0, (st.price - 49) / 49);
    var drop = Math.max(0, (49 - st.price) / 49);
    var churn = clamp(d.churn * o.churnMul * (1 + 0.60 * lift), 0.6, 40);
    var cac = 250 * d.cacMul * p.cacMul * (1 + 0.85 * lift - 0.25 * drop);
    var fixed = d.fixed + o.fixed;
    var cm = st.price - d.vcost;
    var cmPct = st.price > 0 ? cm / st.price * 100 : 0;
    var life = 100 / churn;
    var ltv = cm * life;
    var ratio = cac > 0 ? ltv / cac : 0;
    var payback = cm > 0 ? cac / cm : 999;
    var units = 1400 * Math.pow(49 / st.price, 0.7) * p.volMul;
    var replace = units * churn / 100;
    var profit = units * cm - fixed - replace * cac;
    return { d: d, o: o, p: p, cm: cm, cmPct: cmPct, churn: churn, cac: cac, fixed: fixed,

    var m = model(s);

      h("div", { class: "gauges" }, [
        gauge("Contribution margin", m.cmPct, "target 65% or better", function (v) { return v >= T.cmPct; }, function (v) { return pctS(v, 0); }),
        gauge("LTV to CAC", m.ratio, "target 3.0x or better", function (v) { return v >= T.ratio; }, function (v) { return v.toFixed(2) + "x"; }),
        gauge("CAC payback", m.payback, "target 12 months or less", function (v) { return v <= T.payback; }, function (v) { return v.toFixed(1) + " mo"; }),
        gauge("Monthly operating profit", m.profit, "target $6,000 a month or better", function (v) { return v > T.profit; }, money)
      ]),
      h("div", { class: "simtable" }, [h("table", { html:
        "<tbody>" +
        "<tr><td>Contribution margin per customer</td><td>" + money(m.cm) + " per month (" + pctS(m.cmPct, 0) + ")</td></tr>" +
        "<tr><td>Monthly churn</td><td>" + m.churn.toFixed(2) + "%</td></tr>" +
        "<tr><td>Average customer lifetime</td><td>" + m.life.toFixed(1) + " months</td></tr>" +
        "<tr><td>Customer acquisition cost</td><td>" + money(m.cac) + "</td></tr>" +
        "<tr><td>Lifetime value</td><td>" + money(m.ltv) + "</td></tr>" +
        "<tr><td>Active customers at this price</td><td>" + Math.round(m.units).toLocaleString() + "</td></tr>" +
        "<tr><td>Replacements needed each month</td><td>" + Math.round(m.replace).toLocaleString() +
          " at " + money(m.replace * m.cac) + "</td></tr>" +
        "<tr><td>Fixed costs</td><td>" + money(m.fixed) + " per month</td></tr>" +
        "</tbody>" })]),
      passed
        ? verdict(true, "All four targets met",
            "Contribution margin " + pctS(m.cmPct, 0) + ", LTV to CAC " + m.ratio.toFixed(2) +
            "x, payback " + m.payback.toFixed(1) + " months, and " + money(m.profit) +
            " of monthly operating profit after replacing churned customers. This business funds its own growth.<br><br>" +
            "The reason this configuration works is that retention is doing the heavy lifting: lifetime value is a function of churn, " +
            "and churn is bought with onboarding and delivery, not with discounting.")
        : h("p", { class: "simp", text: hits.filter(Boolean).length + " of 4 targets met. " +
            (m.profit <= T.profit
              ? (m.profit <= 0 ? "You are losing money: the cost of replacing churned customers plus fixed costs exceeds contribution. Cutting price to buy volume makes this worse, not better." : "Profitable, but under the $6,000 a month bar. Thin profit at this scale means no room to absorb a bad quarter.")
              : m.ratio < 3
                ? "Lifetime value is too thin against acquisition cost. That is a churn problem far more often than a pricing problem."
                : "Close. Watch what happens to demand and churn when you move price.") }),
      h("div", { style: "margin-top:14px;display:flex;gap:10px;flex-wrap:wrap" }, [
        btn("Reset", "btn-ghost", function () { s = { price: 49, del: 1, onb: 1, pos: 1 }; draw(); }),
        btn(passed ? "Record result" : "Record attempt", passed ? "btn-gold" : "btn-ghost", function () {
          var sc = Math.round(hits.filter(Boolean).length / 4 * 100);
          finish(sc, passed, "CM " + pctS(m.cmPct, 0) + " / LTV:CAC " + m.ratio.toFixed(2) +
            "x / payback " + m.payback.toFixed(1) + "mo / profit " + money(m.profit));
        })
      ])
    ]));
  }
  draw();
}

/* ========================================================== FUNNEL TYCOON */
var CHANNELS = [
  { id: "search", name: "Paid search", base: 190, sat: 36000, mul: [1, 1, 1, 1, 1, 1], q: 1.00,
    note: "Intent is already there. Reliable, and it gets expensive the moment you exhaust the query volume." },
  { id: "social", name: "Paid social", base: 250, sat: 60000, mul: [1, 1, 1, 1, 1, 1], q: 0.80,
    note: "A far deeper pool and much worse intent. These customers churn fastest, so each one is worth 20% less than the rest." },
  { id: "content", name: "Content and SEO", base: 140, sat: 33000, mul: [5.0, 2.6, 1.5, 1.0, 0.78, 0.62], q: 1.30,
    note: "Ruinous in month one and the cheapest channel you have by month five. It compounds, and its customers stay longest." },
  { id: "outbound", name: "Outbound sales", base: 400, sat: 45000, mul: [1.6, 1.25, 1.0, 1.0, 1.0, 1.0], q: 1.20,
    note: "Expensive and rep-limited while people ramp. Larger customers, so each is worth 20% more." }
];
var BUDGET = 40000, MONTHS = 6, GROSS_PER_CUST = 45, HORIZON = 18;
var FUNNEL_TARGET = 660000, FUNNEL_PAYBACK = 8;

function funnel(el, finish) {
  var month = 0, hist = [], alloc = {}, cum = { cust: 0, spend: 0, contrib: 0 };
  CHANNELS.forEach(function (c) { alloc[c.id] = BUDGET / 4; });

  function cacAt(c, m, spend) {
    return c.base * c.mul[m] * (1 + Math.pow(spend / c.sat, 2));
  }
  function runMonth() {
    var res = [];
    CHANNELS.forEach(function (c) {
      var spend = alloc[c.id];
      var cac = cacAt(c, month, spend);
      var cust = spend > 0 ? spend / cac : 0;
      res.push({ c: c, spend: spend, cust: cust, cac: cac, q: c.q });
    });
    var cust = res.reduce(function (a, r) { return a + r.cust; }, 0);
    var spend = res.reduce(function (a, r) { return a + r.spend; }, 0);
    var qual = res.reduce(function (a, r) { return a + r.cust * r.q; }, 0);
    cum.cust += cust; cum.spend += spend;
    cum.contrib += qual * GROSS_PER_CUST * HORIZON;
    hist.push({ month: month + 1, res: res, cust: cust, spend: spend,
      blended: cust > 0 ? spend / cust : 0 });
    month++;
  }

  function draw() {
    el.innerHTML = "";
    var blended = cum.cust > 0 ? cum.spend / cum.cust : 0;
    var payback = blended / GROSS_PER_CUST;
    var net = cum.contrib - cum.spend;

    if (month < MONTHS) {
      var total = h("b", {});
      var go = btn("Run month " + (month + 1), "btn-gold", function () { runMonth(); draw(); });
      function refresh() {
        var t = CHANNELS.reduce(function (a, c) { return a + alloc[c.id]; }, 0);
        total.textContent = money(t) + " / " + money(BUDGET);
        total.style.color = Math.abs(t - BUDGET) < 1 ? "var(--ok)" : "var(--warn)";
        go.disabled = Math.abs(t - BUDGET) > 1;
      }
      el.appendChild(panel("Month " + (month + 1) + " of " + MONTHS + " — allocate the budget", [
        h("p", { class: "simp", text: "You have " + money(BUDGET) + " a month. Every channel gets more expensive the harder you push it, and two of them cost far more early than they will later. A customer is worth " + money(GROSS_PER_CUST) + " a month of contribution over an eighteen-month horizon, adjusted for how well that channel's customers retain." }),
        h("div", { class: "lever-h", style: "margin-bottom:10px" }, [h("span", { text: "Allocated" }), total])
      ].concat(CHANNELS.map(function (c) {
        var first = c.base * c.mul[month];
        var atSpend = cacAt(c, month, alloc[c.id]);
        return h("div", {}, [
          slider(c.name, 0, BUDGET, 1000, alloc[c.id], function (v) { return money(v); },
            function (v) { alloc[c.id] = v; refresh(); }),
          h("div", { class: "simhint", text: c.note +
            "  This month it starts at " + money(first) + " a customer" +
            (alloc[c.id] > 0 ? " and costs " + money(atSpend) + " at your current spend." : ".") })
        ]);
      })).concat([h("div", { style: "margin-top:16px" }, [go])])));
      refresh();
    }

    el.appendChild(panel("Cumulative", [
      h("div", { class: "gauges" }, [
        gauge("Customers", cum.cust, "more is better", function () { return true; }, function (v) { return Math.round(v).toLocaleString(); }),
        gauge("Blended CAC", blended, "lower is better", function (v) { return v > 0 && v < 300; }, function (v) { return money(v); }),
        gauge("CAC payback", payback, "target 8 months or less", function (v) { return v > 0 && v <= FUNNEL_PAYBACK; }, function (v) { return v.toFixed(1) + " mo"; }),
        gauge("Net contribution", net, "target " + money(FUNNEL_TARGET) + " or better", function (v) { return v >= FUNNEL_TARGET; }, function (v) { return money(v); })
      ])
    ]));

    if (hist.length) {
      el.appendChild(panel("Month by month", [
        h("div", { class: "simtable" }, [h("table", { html:
          "<thead><tr><th>Mo</th>" + CHANNELS.map(function (c) { return "<th>" + c.name + "</th>"; }).join("") +
          "<th>Customers</th><th>Blended CAC</th></tr></thead><tbody>" +
          hist.map(function (r) {
            return "<tr><td>" + r.month + "</td>" + r.res.map(function (x) {
              return "<td>" + (x.spend > 0 ? money(x.spend) + "<br><span style='color:var(--fg-3);font-size:12px'>" +
                (x.cust > 0.5 ? money(x.cac) + " CAC" : "no yield") + "</span>" : "&mdash;") + "</td>";
            }).join("") + "<td>" + Math.round(r.cust) + "</td><td>" + money(r.blended) + "</td></tr>";
          }).join("") + "</tbody></table>" })])
      ]));
    }

    if (month >= MONTHS) {
      var passed = net >= FUNNEL_TARGET && payback <= FUNNEL_PAYBACK;
      var sc = clamp(Math.round(net / FUNNEL_TARGET * 85), 0, 100);
      if (!passed) sc = Math.min(sc, 70);
      el.appendChild(panel("Result", [
        verdict(passed, passed ? "The engine pays for itself" : "You left money on the table",
          "You acquired <b>" + Math.round(cum.cust).toLocaleString() + "</b> customers for " + money(cum.spend) +
          ", a blended CAC of <b>" + money(blended) + "</b> and a payback of <b>" + payback.toFixed(1) +
          " months</b>. Net contribution over an eighteen-month horizon: <b>" + money(net) +
          "</b> against a target of " + money(FUNNEL_TARGET) + ".<br><br>" +
          (payback > FUNNEL_PAYBACK
            ? "A payback beyond eight months means every new customer makes your cash position worse for most of a year before it makes it better. Growth at this payback needs outside capital to survive."
            : "Under an eight-month payback you can reinvest contribution into the next month of spend without external funding.") +
          "<br><br><b>What separates a good run from an average one here:</b> content costs five times its steady-state rate in month one and 62% of it by month six. " +
          "Spending evenly across all four channels every month &mdash; the intuitive move &mdash; buys expensive content early and misses cheap content late. " +
          "Paid social is also a trap: it has the deepest pool, so it never looks saturated, but its customers are worth 20% less than everyone else&#39;s and blended CAC hides that entirely."),
        h("div", { style: "margin-top:14px;display:flex;gap:10px;flex-wrap:wrap" }, [
          btn("Run again", "btn-ghost", function () {
            month = 0; hist = []; cum = { cust: 0, spend: 0, contrib: 0 };
            CHANNELS.forEach(function (c) { alloc[c.id] = BUDGET / 4; }); draw();
          }),
          btn("Record result", "btn-gold", function () {
            finish(sc, passed, "Blended CAC " + money(blended) + ", payback " + payback.toFixed(1) + "mo, net " + money(net));
          })
        ])
      ]));
    }
  }
  draw();
}

/* ============================================================ CASH CRUNCH */
function cash(el, finish) {
  var START = 125000, WEEKS = 13, TARGET = 30000;
  var base = [];
  (function () {
    for (var i = 0; i < WEEKS; i++) {
      var receipts = 44000;
      if (i >= 3 && i <= 5) receipts = 34000;      // three-week demand dip
      if (i === 9) receipts += 46000;               // the big invoice finally lands
      var payroll = (i % 2 === 0) ? 42000 : 0;
      var rent = (i % 4 === 0) ? 15000 : 0;
      var cogs = 15000 + (i % 3) * 1500;
      var mkt = 8000;
      var tax = (i === 6) ? 16000 : 0;              // quarterly tax payment
      base.push({ receipts: receipts, out: payroll + rent + cogs + mkt + tax,
        payroll: payroll, rent: rent, cogs: cogs, mkt: mkt, tax: tax });
    }
  })();

  var wk = 0, cashNow = START, log = [], loc = 0, locWeek = -1, dead = false;
  var mods = base.map(function () { return { rIn: 0, rOut: 0, oIn: 0, oOut: 0 }; });

  var ACTIONS = [
    { id: "none", name: "Hold the line", desc: "Change nothing this week." },
    { id: "ar", name: "Chase receivables", desc: "Pull 40% of next week's receipts forward, at a 6% early-payment discount." },
    { id: "ap", name: "Stretch payables", desc: "Push 45% of this week's supplier cost out two weeks. Costs a 3% late fee on the deferred amount." },
    { id: "cut", name: "Cut marketing", desc: "Halve marketing this week. Receipts two weeks out fall 9%." },
    { id: "loc", name: "Draw the credit line", desc: "Draw $40,000 at a 1.8% fee. Must be repaid before week 13 ends." },
    { id: "repay", name: "Repay the credit line", desc: "Return the outstanding draw in full this week." }
  ];

  function step(actionId) {
    var b = base[wk], m = mods[wk];
    var receipts = b.receipts + m.rIn - m.rOut;
    var out = b.out + m.oIn - m.oOut;
    var note = "";

    if (actionId === "ar" && wk < WEEKS - 1) {
      var pull = base[wk + 1].receipts * 0.4;
      receipts += pull * 0.94;
      mods[wk + 1].rOut += pull;
      note = "Pulled " + money(pull * 0.94) + " forward, gave up " + money(pull * 0.06) + " in discount.";
    } else if (actionId === "ap") {
      var defer = b.cogs * 0.45;
      out -= defer;
      if (wk + 2 < WEEKS) mods[wk + 2].oIn += defer * 1.03;
      note = "Deferred " + money(defer) + " of supplier cost to week " + (wk + 3) + " with a " + money(defer * 0.03) + " fee.";
    } else if (actionId === "cut") {
      out -= b.mkt * 0.5;
      if (wk + 2 < WEEKS) mods[wk + 2].rOut += base[wk + 2].receipts * 0.09;
      note = "Saved " + money(b.mkt * 0.5) + " now; week " + (wk + 3) + " receipts fall 9%.";
    } else if (actionId === "loc") {
      if (loc > 0) return;
      receipts += 40000 - 720;
      loc = 40000; locWeek = wk;
      note = "Drew $40,000 net of a $720 fee. Outstanding until repaid.";
    } else if (actionId === "repay") {
      if (loc <= 0) return;
      out += loc;
      note = "Repaid " + money(loc) + ".";
      loc = 0;
    }

    var open = cashNow;
    cashNow = cashNow + receipts - out;
    log.push({ wk: wk + 1, open: open, receipts: receipts, out: out, close: cashNow,
      action: ACTIONS.filter(function (a) { return a.id === actionId; })[0].name, note: note, loc: loc });
    if (cashNow < 0) dead = true;
    wk++;
    draw();
  }

  function draw() {
    el.innerHTML = "";
    var over = dead || wk >= WEEKS;
    var lo = log.length ? Math.min.apply(null, log.map(function (r) { return r.close; })) : cashNow;

    el.appendChild(panel("Position", [
      h("div", { class: "gauges" }, [
        gauge("Cash on hand", cashNow, "never below zero", function (v) { return v >= 0; }, money),
        gauge("Week", wk, "of 13", function () { return true; }, function (v) { return v + " / 13"; }),
        gauge("Credit line drawn", loc, "must end at zero", function (v) { return v === 0; }, money),
        gauge("Lowest point so far", lo, "the trough is the risk", function (v) { return v >= 0; }, money)
      ]),
      log.length ? h("div", { class: "cashchart" }, log.map(function (r) {
        var pk = Math.max(160000, Math.max.apply(null, log.map(function (x) { return x.close; })));
        var hgt = clamp(r.close / pk * 100, 1, 100);
        return h("div", { class: "cbar" + (r.close < 0 ? " bad" : r.close < 40000 ? " warn" : ""), title: "Week " + r.wk + ": " + money(r.close) }, [
          h("i", { style: "height:" + hgt + "%" }), h("span", { text: r.wk })
        ]);
      })) : null
    ]));

    if (!over) {
      var b = base[wk], m = mods[wk];
      var flags = [b.payroll ? "payroll" : "", b.rent ? "rent" : "", b.tax ? "quarterly tax" : ""]
        .filter(Boolean);
      var line = "Forecast for this week before any action: receipts " + money(b.receipts + m.rIn - m.rOut) +
        ", outflows " + money(b.out + m.oIn - m.oOut) +
        (flags.length ? " (" + flags.join(", ") + ")" : "") + ".";
      el.appendChild(panel("Week " + (wk + 1) + " — what will you do?", [
        h("p", { class: "simp", text: line }),
        h("p", { class: "simp", style: "font-size:14px;color:var(--fg-3)", text: "One action per week. Receipts are in a three-week dip and a large invoice is still outstanding. Doing nothing every week ends in insolvency." }),
        h("div", { class: "actions" }, ACTIONS.filter(function (a) {
          if (a.id === "loc" && loc > 0) return false;
          if (a.id === "repay" && loc <= 0) return false;
          if (a.id === "ar" && wk >= WEEKS - 1) return false;
          return true;
        }).map(function (a) {
          return h("button", { class: "actionb", onclick: function () { step(a.id); } }, [
            h("b", { text: a.name }), h("span", { text: a.desc })
          ]);
        }))
      ]));
    }

    if (log.length) {
      el.appendChild(panel("Week by week", [
        h("div", { class: "simtable" }, [h("table", { html:
          "<thead><tr><th>Wk</th><th>Open</th><th>In</th><th>Out</th><th>Close</th><th>Action</th></tr></thead><tbody>" +
          log.map(function (r) {
            return "<tr><td>" + r.wk + "</td><td>" + money(r.open) + "</td><td>" + money(r.receipts) +
              "</td><td>" + money(r.out) + "</td><td style='color:" + (r.close < 0 ? "var(--bad)" : r.close < 40000 ? "var(--warn)" : "var(--ok)") +
              "'>" + money(r.close) + "</td><td>" + r.action +
              (r.note ? "<br><span style='color:var(--fg-3);font-size:12px'>" + r.note + "</span>" : "") + "</td></tr>";
          }).join("") + "</tbody></table>" })])
      ]));
    }

    if (over) {
      var passed = !dead && cashNow >= TARGET && loc === 0;
      var sc = dead ? 0 : clamp(Math.round(cashNow / TARGET * 70 + (loc === 0 ? 30 : 0)), 0, 100);
      el.appendChild(panel("Result", [
        verdict(passed,
          dead ? "You ran out of cash in week " + wk
               : passed ? "You cleared thirteen weeks" : "You survived, but short of target",
          dead
            ? "Cash went negative. In a real business this is the week payroll bounces &mdash; and it happened while the profit and loss statement still looked fine. That is the entire point of a rolling thirteen-week forecast: it is the only report that would have shown you this trough three weeks out."
            : "You ended on " + money(cashNow) + " with " + (loc === 0 ? "no debt outstanding" : money(loc) + " still drawn") +
              ". Your trough was " + money(lo) + " &mdash; the number that actually determined whether you survived, not the ending balance." +
              (passed ? "" : " The target was " + money(TARGET) + " with the line repaid.")),
        h("div", { style: "margin-top:14px;display:flex;gap:10px;flex-wrap:wrap" }, [
          btn("Run again", "btn-ghost", function () {
            wk = 0; cashNow = START; log = []; loc = 0; dead = false;
            mods = base.map(function () { return { rIn: 0, rOut: 0, oIn: 0, oOut: 0 }; }); draw();
          }),
          btn("Record result", "btn-gold", function () {
            finish(sc, passed, dead ? "Insolvent in week " + wk : "Ended " + money(cashNow) + ", trough " + money(lo));
          })
        ])
      ]));
    }
  }
  draw();
}

/* ====================================================== NEGOTIATION TABLE */
var ISSUES = [
  { id: "price", name: "Headline price",
    opts: [{ l: "$4.0M", you: 0, them: 30 }, { l: "$4.6M", you: 10, them: 22 },
           { l: "$5.2M", you: 20, them: 14 }, { l: "$5.8M", you: 30, them: 4 }],
    note: "The number everyone anchors on. Worth a lot to both sides, so it is the worst issue to trade on alone." },
  { id: "earnout", name: "Earnout share",
    opts: [{ l: "50% earned out over 3 yrs", you: 0, them: 26 }, { l: "35% over 2 yrs", you: 7, them: 19 },
           { l: "20% over 18 mo", you: 13, them: 10 }, { l: "None, all cash at close", you: 18, them: 0 }],
    note: "Buyers use earnouts to shift risk. It costs them real value to give up, and costs you real money to accept." },
  { id: "escrow", name: "Escrow held back",
    opts: [{ l: "15% for 24 months", you: 0, them: 14 }, { l: "10% for 18 months", you: 5, them: 10 },
           { l: "7% for 12 months", you: 9, them: 6 }, { l: "5% for 12 months", you: 12, them: 2 }],
    note: "Cheap for the buyer to concede relative to what it is worth to you. Classic trade currency." },
  { id: "transition", name: "Your transition period",
    opts: [{ l: "24 months full-time", you: 0, them: 22 }, { l: "12 months full-time", you: 8, them: 17 },
           { l: "6 months full-time", you: 14, them: 9 }, { l: "3 months advisory", you: 20, them: 1 }],
    note: "Expensive for the buyer to lose and, for most founders, the issue they undervalue most until they are two years in." }
];
var BUYER_FLOOR = [46, 43, 40, 37, 34]; // softens each round

function negotiate(el, finish) {
  var round = 0, MAXR = 5, pick = { price: 1, earnout: 1, escrow: 1, transition: 1 };
  var hist = [], closed = false, walked = false;

  function val(who) {
    return ISSUES.reduce(function (a, i) { return a + i.opts[pick[i.id]][who]; }, 0);
  }
  function counter() {
    // buyer improves your worst-for-them concession the least; concedes cheapest issue first
    var order = ISSUES.slice().sort(function (a, b) {
      var da = a.opts[Math.max(0, pick[a.id] - 1)].them - a.opts[pick[a.id]].them;
      var db = b.opts[Math.max(0, pick[b.id] - 1)].them - b.opts[pick[b.id]].them;
      return da - db;
    });
    var np = {}; for (var k in pick) np[k] = pick[k];
    var moved = [];
    for (var i = 0; i < order.length && moved.length < 2; i++) {
      var id = order[i].id;
      if (np[id] > 0) { np[id] = np[id] - 1; moved.push(order[i].name); }
    }
    return { p: np, moved: moved };
  }

  function submit() {
    var mine = val("you"), theirs = val("them");
    var floor = BUYER_FLOOR[Math.min(round, BUYER_FLOOR.length - 1)];
    var accepted = theirs >= floor;
    hist.push({ round: round + 1, mine: mine, theirs: theirs, floor: floor, accepted: accepted,
      pick: JSON.parse(JSON.stringify(pick)) });
    if (accepted) { closed = true; }
    else {
      var c = counter();
      pick = c.p;
      hist[hist.length - 1].counterNote = "Buyer rejected and countered, conceding on " + c.moved.join(" and ") + ".";
      round++;
      if (round >= MAXR) walked = true;
    }
    draw();
  }

  function draw() {
    el.innerHTML = "";
    var mine = val("you"), theirs = val("them"), joint = mine + theirs;
    var floor = BUYER_FLOOR[Math.min(round, BUYER_FLOOR.length - 1)];

    if (!closed && !walked) {
      el.appendChild(panel("Round " + (round + 1) + " of " + MAXR + " — build your package", [
        h("p", { class: "simp", text: "You are selling. Four issues, four options each. The numbers on the left are what each option is worth to you. What it is worth to the buyer is hidden, but it is not the same ranking &mdash; and that difference is the only place value gets created. Pure price fighting will not clear their threshold." }),
        h("div", {}, ISSUES.map(function (iss) {
          return h("div", { class: "issue" }, [
            h("div", { class: "lever-h" }, [h("span", { text: iss.name }),

        })),

        ]),
        h("div", { style: "margin-top:14px" }, [btn("Table this offer", "btn-gold", submit)])

    }

    if (hist.length) {

              (passed ? "" : "<br><br>Sixty percent of the value available to you was the bar. You cleared the buyer's threshold by giving away more than you needed to &mdash; usually a sign of conceding on price early instead of trading across issues.")
            : "The buyer walked. Their threshold softened every round; five rounds of packages never reached it. Refusing to concede anything is not a strategy when your alternative to a deal is worse than theirs."),
        h("div", { class: "simtable" }, [h("table", { html:
          "<thead><tr><th>Issue</th><th>Settled at</th><th>Value to you</th><th>Value to buyer</th></tr></thead><tbody>" +
          ISSUES.map(function (iss) {
            var o = iss.opts[final.pick[iss.id]];

          }).join("") + "</tbody></table>" })]),
        h("div", { style: "margin-top:14px;display:flex;gap:10px;flex-wrap:wrap" }, [
          btn("Run again", "btn-ghost", function () {
            round = 0; hist = []; closed = false; walked = false;
            pick = { price: 1, earnout: 1, escrow: 1, transition: 1 }; draw();
          }),
          btn("Record result", "btn-gold", function () {
            finish(sc, passed, closed ? "Closed at " + final.mine + " pts (joint " + eff + "/" + maxJoint + ")" : "No deal");
          })
        ])
      ]));
    }
  }
  draw();
}

/* ============================================================= LESSON ==== */
function vLesson(id) {
  var e = L[id]; if (!e) return notFound();
  var l = e.lesson, c = e.course, s = e.school;
  var meta = l;
  var b = BODIES[id];
  l = (b && typeof b === "object") ? b : {};
  l.title = meta.title; l.minutes = meta.minutes; l.hook = meta.hook;
  var mod = moduleOf(id);
  var seq = mod ? mod.lessons : courseLessonIds(c);
  var i = seq.indexOf(id);
  var prev = i > 0 ? seq[i - 1] : null;
  var nxt = i > -1 && i < seq.length - 1 ? seq[i + 1] : null;

  if (b === undefined) {
    loadBody(id);
    return '<div class="reader" style="padding-top:44px">' +
      '<h1>' + esc(meta.title) + '</h1>' +
      '<div class="hook">' + esc(meta.hook || "") + '</div>' +
      '<div class="card" style="text-align:center;padding:40px"><div class="small">Loading lesson\u2026</div></div></div>';
  }
  if (b === null) return lockedLesson(meta, c, s);

  var body = '<div class="hook">' + esc(l.hook) + '</div>';
  (l.sections || []).forEach(function (sec) {
    body += '<h3>' + esc(sec.h) + '</h3>' + ps(sec.p);
  });
  if (l.formula) {
    body += '<div class="box"><h5>' + esc(l.formula.name) + '</h5>' +
      '<div class="formula">' + esc(l.formula.expr) + '</div>' + lis(l.formula.vars) + '</div>';
  }
  if (l.table && l.table.rows) {
    body += '<div class="box"><table><thead><tr>' +
      l.table.head.map(function (h) { return "<th>" + esc(h) + "</th>"; }).join("") + '</tr></thead><tbody>' +
      l.table.rows.map(function (r) { return "<tr>" + r.map(function (x) { return "<td>" + esc(x) + "</td>"; }).join("") + "</tr>"; }).join("") +
      '</tbody><caption>' + esc(l.table.caption) + '</caption></table></div>';
  }
  if (l.example) {
    body += '<div class="box example"><h5>Worked example</h5>' +
      '<h4 style="font-family:var(--serif);font-size:20px;margin-bottom:12px">' + esc(l.example.title) + '</h4>' +
      ps(l.example.body) + '</div>';
  }
  if (l.mistakes) body += '<div class="box"><h5>Common mistakes</h5>' + lis(l.mistakes) + '</div>';
  if (l.takeaways) body += '<div class="box"><h5>Takeaways</h5>' + lis(l.takeaways) + '</div>';
  if (l.drill) {
    body += '<div class="box drill"><h5>Your drill</h5><p>' + esc(l.drill.prompt) + '</p>' +
      '<p class="small" style="margin:0"><b>Hint:</b> ' + esc(l.drill.hint) + '</p></div>';
  }

  return '<div class="reader" style="padding-top:44px">' +
    '<div class="mod-meta" style="margin-bottom:20px">' +
      (mod ? '<button class="chip gold" data-go="#/module/' + mod.id + '">Module ' + mod.n + ' &middot; ' + esc(mod.title) + '</button>' : '') +
      '<button class="chip" data-go="#/course/' + c.id + '">' + esc(c.title) + '</button>' +
      '<span class="chip">' + l.minutes + ' min</span>' +
      '<span class="chip">' + esc(s.short) + '</span></div>' +
    '<h1>' + esc(l.title) + '</h1>' + body +
    (meta.is_free && !S.enrolled ? openLessonCard() : '') +
    '<div class="lesson-nav">' +
      (prev ? '<button class="btn btn-ghost" data-go="#/lesson/' + prev + '">&larr; Previous</button>' : '<span></span>') +
      '<button class="btn ' + (isDone(id) ? "btn-ghost" : "btn-gold") + '" id="mark">' +
        (isDone(id) ? "&#10003; Completed" : "Mark complete" + (nxt ? " &amp; continue" : "")) + '</button>' +
      (nxt ? '<button class="btn btn-ghost" data-go="#/lesson/' + nxt + '">Next &rarr;</button>'
           : '<button class="btn btn-ghost" data-go="#/quiz/' + c.id + '">Take the quiz &rarr;</button>') +
    '</div></div>';
}

  var c = e.course;
  if (!quizState || quizState.id !== id) quizState = { id: id, answers: {}, submitted: false };

  var loaded = ANSWERS[id];
  if (loaded === undefined || loaded === "loading") {
    loadQuiz(id, function () { render._keepScroll = true; render(); });
    return '<section style="padding-top:44px"><div class="narrow">' +
      '<h1 style="font-size:clamp(26px,4.4vw,40px);margin-bottom:14px">' + esc(c.title) + '</h1>' +
      '<div class="card" style="text-align:center;padding:40px"><div class="small">Loading assessment\u2026</div></div>' +
      '</div></section>';
  }
  // The answer key is entitled content. Without it there is no quiz to sit.
  if (loaded === null || !loaded.length || loaded[0].answer === null) {
    return '<section style="padding-top:44px"><div class="narrow">' +
      '<button class="chip" data-go="#/course/' + c.id + '" style="margin-bottom:22px">&larr; ' + esc(c.title) + '</button>' +
      '<div class="eyebrow">Assessment</div>' +
      '<h1 style="font-size:clamp(26px,4.4vw,40px);margin-bottom:14px">' + esc(c.title) + '</h1>' +
      '<div class="simcard"><div class="eyebrow">Enrolled students only</div>' +
      '<h3 style="font-size:22px;margin-bottom:12px">Graded assessments are part of the programme</h3>' +
      '<p style="color:var(--fg-2);max-width:60ch">Six scenario questions, 80% to clear, with the reasoning ' +
      'behind every answer. Marks are recorded against your account.</p>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
      (DB.signedIn() ? payButton("university", "btn-gold")
                     : '<button class="btn btn-gold btn-sm" data-go="#/apply">Apply free</button>' +
                       '<button class="btn btn-ghost btn-sm" data-go="#/signin">Sign in</button>') +
      '</div>' + tuitionLine() + '</div></div></section>';
  }

  var qs = loaded;
  var done = quizState.submitted;
  var correct = qs.filter(function (q, i) { return quizState.answers[i] === q.answer; }).length;
  var score = pct(correct, qs.length);

  var head = '<button class="chip" data-go="#/course/' + c.id + '" style="margin-bottom:22px">&larr; ' + esc(c.title) + '</button>' +
    '<div class="eyebrow">Assessment</div>' +
    '<h1 style="font-size:clamp(26px,4.4vw,40px);margin-bottom:12px">' + esc(c.title) + '</h1>' +
    '<p class="lede">' + qs.length + ' scenario questions. 80% clears the course. ' +
      'Questions test judgment, not recall.</p>';

  var result = "";
  if (done) {
    var passed = score >= 80;
    result = '<div class="card" style="text-align:center;margin:26px 0">' +
      '<div class="score-ring" style="--p:' + score + ';--sc:' + (passed ? "var(--ok)" : "var(--warn)") + '"><b>' + score + '%</b></div>' +
      '<h3 style="font-size:26px;margin-bottom:8px">' + (passed ? "Cleared" : "Below the bar") + '</h3>' +
      '<p style="color:var(--fg-2);max-width:52ch;margin:0 auto 18px">' +
        (passed ? "You answered " + correct + " of " + qs.length + " correctly. The reasoning behind every question is below."
                : "You answered " + correct + " of " + qs.length + " correctly and need " + Math.ceil(qs.length * 0.8) +
                  ". Read the explanations, revisit the lessons flagged below, and retake.") + '</p>' +
      '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
        '<button class="btn btn-ghost btn-sm" id="retake">Retake</button>' +
        (passed ? '<button class="btn btn-gold btn-sm" data-go="#/dashboard">Progress</button>'
                : '<button class="btn btn-gold btn-sm" data-go="#/course/' + c.id + '">Back to lessons</button>') +
      '</div></div>';
  }

  var body = qs.map(function (q, i) {
    var sel = quizState.answers[i];
    return '<div class="q"><b>' + (i + 1) + ". " + esc(q.q) + '</b>' +
      q.options.map(function (o, j) {
        var cls = "opt";
        if (done) {
          if (j === q.answer) cls += " right";
          else if (sel === j) cls += " wrong";
        } else if (sel === j) cls += " sel";
        return '<button class="' + cls + '" data-q="' + i + '" data-o="' + j + '"' + (done ? " disabled" : "") + '>' +
          '<span class="k">' + "ABCD".charAt(j) + '</span><span>' + esc(o) + '</span></button>';
      }).join("") +
      (done ? '<div class="expl">' + esc(q.explain) + '</div>' : '') + '</div>';
  }).join("");

  var submit = done ? "" :
    '<div style="text-align:center;margin-top:24px">' +
    '<button class="btn btn-gold" id="submit"' + (Object.keys(quizState.answers).length < qs.length ? " disabled" : "") + '>' +
      'Submit ' + Object.keys(quizState.answers).length + ' of ' + qs.length + '</button></div>';

  return '<section style="padding-top:44px"><div class="narrow">' + head + result + body + submit + '</div></section>';
}

function loadBody(id) {
  if (BODIES[id] !== undefined) return;
  BODIES[id] = "loading";
  DB.lessonBody(id).then(function (row) {
    BODIES[id] = row || null;
    if (parse().r === "lesson" && parse().a === id) { render._keepScroll = true; render(); }
  }).catch(function () {
    BODIES[id] = null;
    if (parse().r === "lesson" && parse().a === id) { render._keepScroll = true; render(); }
  });
}

function loadQuiz(courseId, then) {
  if (ANSWERS[courseId] !== undefined && ANSWERS[courseId] !== "loading") { then(); return; }
  if (ANSWERS[courseId] === "loading") return;
  ANSWERS[courseId] = "loading";
  Promise.all([DB.quizQuestions(courseId), DB.quizAnswers(courseId)])
    .then(function (r) {
      var qs = r[0] || [], keys = r[1] || [];
      var byId = {};
      keys.forEach(function (k) { byId[k.question_id] = k; });
      ANSWERS[courseId] = qs.map(function (q) {
        var k = byId[q.id];
        return { q: q.prompt, options: q.options,
                 answer: k ? k.answer : null, explain: k ? k.explain : null };
      });
      then();
    })
    .catch(function () { ANSWERS[courseId] = null; then(); });
}

    var sorted = dims.map(function (d, i) { return { d: d, v: res.answers[i], i: i }; })

      '<div class="eyebrow">Founder Fit &middot; Report</div>' +

  }

    '<div class="eyebrow">Step two &middot; Founder Fit</div>' +
    '<h1 style="font-size:clamp(28px,4.6vw,44px);margin-bottom:14px">Where are you actually strong?</h1>' +

    '<div style="margin-top:34px">' + dims.map(function (d, i) {
      return '<div class="card" style="margin-bottom:14px;padding:22px">' +
        '<div class="eyebrow mute">' + esc(d.name) + '</div>' +
        '<p style="font-size:16.5px;margin-bottom:16px">' + esc(d.q) + '</p>' +
        '<div class="scale">' + [1,2,3,4,5].map(function (v) {

function vGlossary(q) {
  var terms = [];
  SCHOOLS.forEach(function (s) {
    s.courses.forEach(function (c) {
      (c.glossary || []).forEach(function (g) { terms.push({ t: g.term, d: g.def, s: s, c: c }); });
    });
  });
  terms.sort(function (a, b) { return a.t.toLowerCase() < b.t.toLowerCase() ? -1 : 1; });
  var f = (q || "").toLowerCase();
  var shown = f ? terms.filter(function (x) { return (x.t + " " + x.d).toLowerCase().indexOf(f) > -1; }) : terms;
  return '<section style="padding-top:56px"><div class="wrap">' +
    '<div class="sec-head"><div class="eyebrow">Reference</div><h2>Glossary</h2>' +
    '<p class="lede">' + terms.length + ' terms drawn from every course, each defined the way it is actually used in a deal room or a board meeting.</p></div>' +
    '<input class="srch" id="gsearch" placeholder="Filter terms..." value="' + esc(q || "") + '" style="margin-bottom:22px">' +
    '<div class="grid g2" style="gap:12px">' + shown.map(function (x) {
      return '<div class="card" style="padding:18px"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">' +
        '<b style="font-size:16px;font-family:var(--serif)">' + esc(x.t) + '</b>' +
        '<span class="chip" style="font-size:10px">' + esc(x.s.short) + '</span></div>' +
        '<p style="font-size:14.5px;color:var(--fg-2);margin:8px 0 0">' + esc(x.d) + '</p></div>';
    }).join("") + '</div>' +
    (shown.length ? "" : '<p class="lede">No terms match that filter.</p>') +
  '</div></section>';
}

/* ============================================================== SEARCH == */
function vSearch(q) {
  q = q || "";
  var f = q.toLowerCase().trim();
  var hits = [];
  if (f.length > 1) {
    ALL_LESSONS.forEach(function (id) {
      var e = L[id], l = e.lesson;
      var hay = (l.title + " " + l.hook + " " + (l.sections || []).map(function (s) { return s.h; }).join(" ")).toLowerCase();
      var score = 0;
      if (l.title.toLowerCase().indexOf(f) > -1) score += 10;
      if (hay.indexOf(f) > -1) score += 4;
      var deep = JSON.stringify(l).toLowerCase();
      if (!score && deep.indexOf(f) > -1) score += 1;
      if (score) hits.push({ id: id, e: e, score: score });
    });
    hits.sort(function (a, b) { return b.score - a.score; });
  }
  return '<section style="padding-top:56px"><div class="narrow">' +
    '<div class="eyebrow">Search</div><h1 style="font-size:clamp(26px,4.4vw,40px);margin-bottom:20px">Find anything</h1>' +
    '<input class="srch" id="ssearch" placeholder="Try: CAC, working capital, earnout, bottleneck, dilution" value="' + esc(q) + '" autofocus>' +
    '<div style="margin-top:24px">' +
      (f.length > 1
        ? (hits.length
            ? '<p class="small">' + hits.length + ' lesson' + (hits.length === 1 ? "" : "s") + '</p>' +
              hits.slice(0, 40).map(function (h) { return lessonRow(h.id, true); }).join("")
            : '<p class="lede">Nothing matched. Try a broader term.</p>')
        : '<p class="lede">Type at least two characters. Search covers all ' + ALL_LESSONS.length + ' lessons, including body text.</p>') +
    '</div></div></section>';
}

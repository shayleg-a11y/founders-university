/* ============================================================== ROUTER == */
function parse() {
  var h = (location.hash || "#/").slice(1);
  var qi = h.indexOf("?");
  var query = "";
  if (qi > -1) { query = decodeURIComponent(h.slice(qi + 1).replace(/^q=/, "")); h = h.slice(0, qi); }
  var parts = h.split("/").filter(Boolean);
  return { r: parts[0] || "", a: parts[1] || "", q: query };
}

function render() {
  var p = parse(), v;
  switch (p.r) {
    case "": v = vHome(); break;
    case "path": v = vPath(); break;
    case "module": v = vModule(p.a); break;
    case "library": v = vLibrary(); break;
    case "school": v = vSchool(p.a); break;
    case "course": v = vCourse(p.a); break;
    case "lesson": v = vLesson(p.a); break;
    case "quiz": v = vQuiz(p.a); break;
    case "sim": v = vSim(p.a); break;
    case "fit": v = vFit(); break;
    case "signin": v = vAuth("in"); break;
    case "signup": v = vAuth("up"); break;
    case "account": v = vAuth("in"); break;
    case "tracks": v = vTracks(); break;
    case "dashboard": v = vDash(); break;
    case "apply": v = vApply(); break;
    case "admin": v = vAdmin(); break;
    case "certificate": v = vCert(); break;
    case "glossary": v = vGlossary(p.q); break;
    case "search": v = vSearch(p.q); break;
    case "terms": case "refunds": case "privacy": v = vLegal(p.r); break;
    default: v = notFound();
  }
  document.getElementById("app").innerHTML =
    nav() + '<main class="fade">' + v + '</main>' + foot();
  document.title = titleFor(p);
  if (!render._keepScroll) window.scrollTo(0, 0);
  render._keepScroll = false;
  bind();
  if (p.r === "sim" && SIM[p.a]) mountSim(p.a);
}

function mountSim(id) {
  var host = document.getElementById("simmount");
  if (!host) return;
  host.innerHTML = "";
  try {
    SIM[id].mount(host, function (score, passed, summary) {
      var rec = S.sims[id] || { best: 0, attempts: 0, passed: false };
      rec.attempts++; rec.best = Math.max(rec.best, score);
      rec.passed = rec.passed || !!passed; rec.last = summary || "";
      S.sims[id] = rec; save();
      DB.recordSim(id, score, !!passed, summary || "");
      toast(passed ? "Simulation cleared at " + score + "%" : "Recorded \u2014 " + score + "%");
      var m = MOD[SIM[id].module];
      if (m) go("#/module/" + m.id);
    });
  } catch (e) {
    host.innerHTML = '<div class="card"><b>This simulation failed to start.</b>' +
      '<p class="small" style="margin:8px 0 0">' + esc(e.message) + '</p></div>';
    if (window.console) console.error(e);
  }
}
function titleFor(p) {
  var b = " — Founder's University";
  if (p.r === "lesson" && L[p.a]) return L[p.a].lesson.title + b;
  if (p.r === "module" && MOD[p.a]) return "Module " + MOD[p.a].n + " · " + MOD[p.a].title + b;
  if (p.r === "school" && C[p.a]) return C[p.a].title + b;
  if (p.r === "course" && CO[p.a]) return CO[p.a].course.title + b;
  if (p.r) return p.r.charAt(0).toUpperCase() + p.r.slice(1) + b;
  return "Founder's University — From Idea to Exit";
}

    }

      var score = Math.round((sum - fitState.a.length) / (fitState.a.length * 4) * 100);

// Pull the signed-in user's record down over whatever is in this browser. The
// server is the source of truth once you have an account; localStorage is only
// the fallback for people who have not signed up yet.
function syncFromServer() {
  if (!DB.signedIn()) {
    ENTITLED = { "founder-fit": false, "university": false };
    IS_ADMIN = false; MY_APP = null; ADMIN = null;
    return Promise.resolve();
  }
  IS_ADMIN = false; MY_APP = null; ADMIN = null;
  return Promise.all([DB.entitlements(), DB.loadProgress(), DB.amAdmin(), DB.myApplication()]).then(function (r) {
    var ents = r[0] || [], prog = r[1];
    IS_ADMIN = r[2] === true; MY_APP = r[3] || null; ADMIN = null;
    ENTITLED = { "founder-fit": false, "university": false };
    ents.forEach(function (e) {
      if (e.tier === "partner") { ENTITLED["founder-fit"] = ENTITLED.university = true; }
      if (e.tier === "university") { ENTITLED.university = true; ENTITLED["founder-fit"] = true; }
      if (e.tier === "founder-fit") { ENTITLED["founder-fit"] = true; }
    });
    S.purchases = {};
    if (ENTITLED["founder-fit"]) S.purchases["founder-fit"] = Date.now();
    if (ENTITLED.university) { S.purchases.university = Date.now(); S.enrolled = true; }
    if (prog) {
      S.done = prog.done; S.quiz = prog.quiz; S.sims = prog.sims;
      S.milestones = prog.milestones; S.fit = prog.fit;
      if (prog.name) S.name = prog.name;
      if (prog.track) S.track = prog.track;
    }
    // A fresh sign-in invalidates whatever the previous visitor could read.
    BODIES = {}; ANSWERS = {};
    save();
  }).catch(function (e) {
    if (window.console) console.warn("sync failed", e && e.message);
  });
}

}

// and the entitlement has not landed yet, re-read a few times before giving up.
function awaitEntitlement(tier, tries) {
  return syncFromServer().then(function () {
    if (ENTITLED[tier] || !tries) return;
    return new Promise(function (r) { setTimeout(r, 1500); })
      .then(function () { return awaitEntitlement(tier, tries - 1); });
  });
}

DB.adoptUrlSession()
  .then(function (a) {
    if (a && a.error) authMsg = "!" + a.error;
    // Say which account the link signed in, so a wrong one is noticed.
    if (a && a.session && a.session.user) setTimeout(function () {
      toast("Signed in as " + (a.session.user.email || "your account"));
    }, 1500);
    return DB.catalogue();
  })
  .then(function (cat) {
    C = cat; rebuildIndex();
    MISSING = PATH_LESSONS.filter(function (id) { return !L[id]; });
    if (MISSING.length && window.console) console.warn("Path references unknown lessons:", MISSING);
    purchased = handlePurchaseReturn();
    return purchased ? awaitEntitlement(purchased, 4) : syncFromServer();
  })
  .then(function () {
    render();
    if (purchased) {
      toast(ENTITLED[purchased]
        ? "Payment received \u2014 " + PAY.tiers[purchased].label + " unlocked"
        : "Payment received \u2014 unlocking shortly, refresh if it does not appear");
    }
  })
  .catch(function (e) { bootError(e && e.message); });

window.__SU = { P: P, S: S, SIM: SIM, PAY: PAY, DB: DB,
  mountSim: mountSim, handlePurchaseReturn: handlePurchaseReturn,
  syncFromServer: syncFromServer,
  get C() { return C; }, get L() { return L; }, get CO() { return CO; },
  get BODIES() { return BODIES; }, get ANSWERS() { return ANSWERS; },
  get ENTITLED() { return ENTITLED; },
  stats: function () {
    return { schools: SCHOOLS.length, courses: Object.keys(CO).length, lessons: ALL_LESSONS.length,
      questions: TOTAL_Q, minutes: TOTAL_MIN, pathLessons: PATH_LESSONS.length,
      sims: SIMS.length, missing: MISSING }; } };
})();

</script>
